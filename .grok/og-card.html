<style>

    height: 630px;

    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 64%;

    margin: 0;
    padding-left: 0.18em;
    font-family: "Liberation Serif", "DejaVu Serif", Georgia, serif;
    font-weight: 400;
    font-size: 168px;
    letter-spacing: 0.18em;
    line-height: 0.9;
    color: #F3F1EC;
    text-shadow:
      0 1px 0 rgba(20,21,18,0.35),
      0 10px 36px rgba(11,12,11,0.55);
  }
  .rule {
    display: block;
    width: 120px;
    height: 2px;
    margin: 28px auto 0;
    background: #C5CDC8;
    opacity: 0.85;
    border: 0;

</style>
